title: Stage 1 Mathematics Practice Workbook
subtitle: NSW Curriculum Aligned (NESA 2022 Stage 1)
stage: 1
header_left: NSW Primary Mathematics Practice
seed: null
include_solutions: true
font_size: 14pt
working_space: 2.5cm
# Horizontal gap between digit columns (xlop default: 2ex). Try 2.5ex-3.5ex for more room.
arithmetic_column_width: 3ex
# Multiplier on \baselineskip for the vertical gap between rows (xlop default: 1.0). Try 1.2-1.5 for more room.
arithmetic_line_height: 2.0

# One line per topic. Practice area, layout, and spacing come from the
# question catalogue. A `sections:` list still works for custom titles.
topics:
  representing_numbers: {count: 2, difficulty: easy}
  vertical_addition: {count: 3, difficulty: medium, digits: 3, allow_carrying: true}
  vertical_subtraction: {count: 3, difficulty: medium, digits: 3, allow_borrowing: true}
  vertical_multiplication: {count: 3, difficulty: easy, digits_top: 3, digits_bottom: 1, times_table: [3, 4]}
  fractions: {count: 3, difficulty: easy, op_type: addition}
  sequences: {count: 3, difficulty: easy, step_range: [1, 100], pattern_type: arithmetic}
  reading_time: {count: 2, difficulty: medium}
  date_duration: {count: 2, difficulty: hard}
  speed_distance: {count: 1, difficulty: medium}
  2d_shapes: {count: 2, difficulty: easy}
  3d_objects: {count: 2, difficulty: easy}
  compass_directions: {count: 2, difficulty: easy}
  data: {count: 2, difficulty: easy}
  chance: {count: 1, difficulty: easy}
