# ==============================================================================
# User-extensible question bank
# ==============================================================================
# One topic, then a flat questions: list. No Python. A topic here is available
# everywhere a built-in topic is (config, the web picker, the PDF, the quiz).
# A name already used by generator.py is left to that Python generator.
#
#   topics:
#     doubling:
#       area: Patterns & Algebra
#       count: 3
#       stage: 2
#       outcomes: MA2-MR-01          # one code applies to every difficulty
#       questions:
#         - difficulty: medium
#           prompt: "Double 7."
#           solution: "$7 \\times 2 = \\mathbf{14}$"
#           answer: "14"
#         - difficulty: medium
#           prompt: "Double {n}."
#           n: 2..50                  # or start: [North, East, South, West]
#           compute: n * 2            # sets {answer}; a mapping sets several names
#           solution: "${n} \\times 2 = \\mathbf{{{answer}}}$"
#
# difficulty defaults to medium. difficulty: all (or a list) copies one question
# onto several tiers. Literal LaTeX braces are doubled, same as an f-string.
# compute is a restricted Python expression: your params, earlier compute
# names, and CARDINAL4 / COMPASS8 / CARDINAL_VECTOR / abs / min / max / round /
# int / len. Trusted file, same as config.yaml, not a sandbox.
#
# The older nested bank -> easy/medium/hard/genius -> exact/generate layout
# still loads. The web editor rewrites topics in the compact layout above.
# ==============================================================================

topics:
  compass_directions:
    area: Geometry & Shape
    count: 2
    outcomes:
      easy: {code: MA1-GM-01, stage: 1}
      medium: {code: MA2-GM-01, stage: 2}
      hard: {code: MA3-GM-01, stage: 3}
      genius: {code: MA3-GM-01, stage: 3}
    questions:
    - difficulty: easy
      prompt: On a compass, which direction is directly opposite North?
      solution: North and South are opposite directions. The opposite of North is $\textbf{South}$.
      answer: South
    - difficulty: easy
      prompt: On a compass, which direction is directly opposite East?
      solution: East and West are opposite directions. The opposite of East is $\textbf{West}$.
      answer: West
    - difficulty: easy
      prompt: On a compass, which direction is directly opposite {start}?
      solution: The opposite of {start} is $\textbf{{{answer}}}$.
      start: [North, East, South, West]
      compute: CARDINAL4[(CARDINAL4.index(start) + 2) % 4]
    - difficulty: medium
      prompt: A compass needle points North. You turn $90^\circ$ clockwise. Which direction do you now face?
      solution: Turning $90^\circ$ clockwise from North lands on $\textbf{East}$.
      answer: East
    - difficulty: medium
      prompt: You are facing East and turn $180^\circ$. Which direction do you now face?
      solution: A $180^\circ$ turn is a half-turn, so East becomes $\textbf{West}$.
      answer: West
    - difficulty: medium
      prompt: Facing {start}, you turn {turn_deg}$^\circ$ clockwise. Which direction do you now face?
      solution: Turning {turn_deg}$^\circ$ clockwise from {start} lands on $\textbf{{{answer}}}$.
      start: [North, North-East, East, South-East, South, South-West, West, North-West]
      clicks: [1, 2, 3, 5, 6, 7]
      compute:
        turn_deg: clicks * 45
        answer: COMPASS8[(COMPASS8.index(start) + clicks) % 8]
    - difficulty: hard
      prompt: A hiker starts at grid point $(0,0)$ facing North and walks 4 squares forward. What are their new coordinates?
      solution: 'Walking North increases the $y$-coordinate: $(0,0) \to (0,4)$. New coordinates: $\mathbf{(0,4)}$.'
      answer: (0,4)
    - difficulty: hard
      prompt: A hiker starts at grid point $(0,0)$ facing {start_dir} and walks {steps} squares forward. What are their new coordinates?
      solution: 'Walking {steps} squares {start_dir} moves $(0,0) \to ({dx},{dy})$. New coordinates: $\mathbf{{({dx},{dy})}}$.'
      start_dir: [North, East, South, West]
      steps: 2..6
      compute:
        dx: CARDINAL_VECTOR[start_dir][0] * steps
        dy: CARDINAL_VECTOR[start_dir][1] * steps
      answer: ({dx},{dy})
    - difficulty: genius
      prompt: What is the three-figure bearing for due East? (North $= 000^\circ$, East $= 090^\circ$, measured clockwise)
      solution: 'Bearings are measured clockwise from North. East is a quarter-turn ($90^\circ$) clockwise: $\mathbf{090^\circ}$.'
      answer: 090
    - difficulty: genius
      prompt: A ship is sailing on a bearing of {start_bearing:03d}$^\circ$. It turns {turn_deg}$^\circ$ clockwise. What is its new three-figure bearing?
      solution: New bearing $= ({start_bearing}^\circ + {turn_deg}^\circ) \bmod 360^\circ = \mathbf{{{new_bearing:03d}^\circ}}$.
      start_bearing: [0, 45, 90, 135, 180, 225, 270, 315]
      turn_deg: [45, 90, 135, 180, 225, 270, 315]
      compute:
        new_bearing: (start_bearing + turn_deg) % 360
      answer: '{new_bearing:03d}'
